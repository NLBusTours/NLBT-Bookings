name: NLBT bus availability sync

on:
  push:
    branches: [main]
    paths:
      - "availability/**"
      - ".github/workflows/sync-bus-availability.yml"
  schedule:
    # Quarter-hour refreshes give extra chances if GitHub delays a scheduled run.
    # Offset from the top of the hour to reduce peak scheduling congestion.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nlbt-bus-availability-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install iCalendar parsers
        run: python -m pip install -r availability/requirements.txt
      - name: Test calendar parser
        run: python -m unittest discover -s availability -p "test_*.py" -v
      - name: Fetch and sanitize all three calendars
        env:
          NLBT_RT2_ICAL_URL: ${{ secrets.NLBT_RT2_ICAL_URL }}
          NLBT_RX2_ICAL_URL: ${{ secrets.NLBT_RX2_ICAL_URL }}
          NLBT_R3_ICAL_URL: ${{ secrets.NLBT_R3_ICAL_URL }}
          NLBT_SHEETS_BRIDGE_URL: ${{ secrets.NLBT_SHEETS_BRIDGE_URL }}
          NLBT_SHEETS_BRIDGE_TOKEN: ${{ secrets.NLBT_SHEETS_BRIDGE_TOKEN }}
        run: |
          if [ -z "$NLBT_RT2_ICAL_URL" ] || [ -z "$NLBT_RX2_ICAL_URL" ] || [ -z "$NLBT_R3_ICAL_URL" ]; then
            echo "::notice title=Bus availability not configured::Set all three private calendar secrets to activate."
            exit 0
          fi
          python availability/sync.py
      - name: Publish anonymous occupied time ranges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python availability/publish_issue.py
